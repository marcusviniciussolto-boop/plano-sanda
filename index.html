<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano Sanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0D0D0C">
<meta name="application-name" content="Plano Sanda">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plano Sanda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style id="css">:root{
  /* tela clara, cards brancos bem arredondados, botões pretos. Laranja só pra esforço forte, azul só pra esforço leve. */
  --bg:#E8E7E3;
  --card:#FFFFFF;
  --soft:#F2F1ED;
  --ink:#0D0D0C;
  --muted:#6F6C65;
  --line:#E6E4DE;
  --prop:#CFCCC3;
  --hard:#FF5A1F;
  --hard-ink:#D2400A;
  --easy:#2F6BFF;
  --ok:#0F8A47;
  --warn:#B36E00;
  --danger:#D12F2F;
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,output,a{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.ic{display:block;flex:none}

/* layout */
.app{max-width:520px;margin:0 auto;padding:0 14px calc(128px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:15px;background:var(--ink);display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:34px;height:34px}
.who small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.who b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.wk{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;flex:none}
.wk button{width:38px;height:38px;border:0;border-radius:999px;background:var(--soft);display:grid;place-items:center}
.wk button:disabled{opacity:.35;cursor:default}
.wkLabel{min-width:78px;text-align:center;font-size:12px;line-height:1.15;color:var(--muted)}
.wkLabel b{display:block;color:var(--ink);font-size:14px;font-weight:700}
.view{display:flex;flex-direction:column;gap:12px}

/* hero escuro */
.hero{background:var(--ink);color:#fff;border-radius:32px;padding:22px 20px 22px;position:relative;overflow:hidden;min-height:226px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.heroArt{position:absolute;right:-52px;top:-52px;width:206px;pointer-events:none}
.heroArt svg{display:block;width:100%;height:auto}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--hard-ink)}
.hero .eyebrow{color:#FF8A5C;position:relative}
.hero h1{font-family:var(--display);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:56px;line-height:.92;position:relative;letter-spacing:.005em}
.hero p{font-size:15px;color:#C9C6BD;max-width:34ch;position:relative}
.heroChips{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.hchip{font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px}
.hchip.hard{background:var(--hard);border-color:var(--hard);color:#1A0A02}
.hchip.easy{background:#fff;border-color:#fff;color:var(--ink)}

/* pageTitle simples (semana, timer etc) */
.pageTitle{padding:14px 4px 4px;display:flex;flex-direction:column;gap:4px}
.pageTitle h1{font-family:var(--display);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:44px;line-height:.95;text-wrap:balance}
.pageTitle p{color:var(--muted);font-size:15px;max-width:44ch}
.back{background:none;border:0;color:var(--muted);padding:8px 4px 0;font-size:14px;font-weight:600;align-self:flex-start;display:flex;align-items:center;gap:4px}

/* tiles de atalho */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:26px;padding:6px}
.tiles button{background:none;border:0;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-weight:600;font-size:15px;border-radius:20px;padding-left:16px}
.tiles .tIc{width:30px;height:30px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center}

/* cards */
.card{background:var(--card);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.cardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.when{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:2px}
h2{font-family:var(--display);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:30px;line-height:1;text-wrap:balance}
.count{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:26px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.count b{color:var(--ink)}
.lead{font-size:16px;max-width:60ch}
.small{font-size:14px;color:var(--muted);max-width:60ch}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;max-width:60ch;font-size:15.5px}
b.hard{color:var(--hard-ink)}
b.easy{color:var(--easy)}

/* lista de exercícios */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rowMain{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;background:none;border:0;padding:0;text-align:left;min-width:0}
.thumb{background:var(--soft);border-radius:18px;display:block;width:92px;height:60px;overflow:hidden}
.thumb .fig{width:100%;height:100%}
.rowTxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rowTxt b{font-size:17px;line-height:1.2}
.dose{font-size:14px;font-weight:700;color:var(--hard-ink)}
.more{font-size:13px;color:var(--muted)}
.tick{width:46px;height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:transparent;display:grid;place-items:center}
.tick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.row.done .rowTxt b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.row.done .thumb{opacity:.55}

/* botões */
.pill{border:0;border-radius:999px;padding:15px 22px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.pill.black{background:var(--ink);color:#fff}
.pill.white{background:#fff;color:var(--ink)}
.pill.ghost{background:var(--soft);color:var(--ink)}
.pill.big{width:100%;padding:18px;font-size:17px}
.pill:disabled{opacity:.6}
.pill.sm{padding:10px 16px;font-size:14px}
.link{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2.5px solid var(--easy);outline-offset:2px}
.notice{background:var(--card);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:15px}

/* semana */
.dayList{display:flex;flex-direction:column;gap:10px}
.dayCard{display:grid;grid-template-columns:54px 1fr 20px;gap:12px;align-items:center;background:var(--card);border:0;border-radius:26px;padding:16px 16px;text-align:left;width:100%}
.dNum{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.dTxt{display:flex;flex-direction:column;gap:8px;min-width:0}
.dTxt b{font-size:17px;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;background:var(--soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.hard{background:#FFE3D6;color:#8F2A00}
.chip.easy{background:#DDE8FF;color:#183E9B}
.dayCard.is-today{background:var(--ink);color:#fff}
.dayCard.is-today .chip{background:rgba(255,255,255,.14);color:#fff}
.dayCard.is-today .chip.hard{background:var(--hard);color:#1A0A02}
.dayCard.is-today .chip.easy{background:#fff;color:var(--ink)}
.dayCard .arrow{color:var(--muted)}
.dayCard.is-today .arrow{color:#aaa}

/* timer */
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.clock{background:var(--card);border-radius:34px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s}
.clock.hard{background:var(--hard)}
.ringBox{position:relative;width:100%;max-width:320px;aspect-ratio:1}
.ringT{width:100%;height:100%;display:block}
.rTrack{fill:none;stroke:var(--soft);stroke-width:14}
.rProg{fill:none;stroke:var(--easy);stroke-width:14;stroke-linecap:round;stroke-dasharray:653.45;stroke-dashoffset:0}
.clock.hard .rTrack{stroke:rgba(0,0,0,.16)}
.clock.hard .rProg{stroke:var(--ink)}
.clockIn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.phaseName{font-family:var(--display);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:30px;letter-spacing:.04em;line-height:1}
.clock.easy .phaseName{color:var(--easy)}
.time{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:min(23vw,92px);line-height:.95;font-variant-numeric:tabular-nums}
.round{font-size:15px;font-weight:700;min-height:1.3em}
.next{font-size:14px;color:var(--muted);min-height:1.4em;text-align:center}
.clock.hard .next{color:#2a1105}
.row2{display:flex;gap:10px}
.row2 .pill.black{flex:1}

/* pausas */
.statTop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bigNum{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.bigNum small{font-family:var(--body);font-stretch:100%;font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
.delta{font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px}
.delta.ok{background:#DDF5E7;color:var(--ok)}
.delta.warn{background:#FFF0D1;color:var(--warn)}
.delta.flat{background:var(--soft);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.cGrid{stroke:var(--line);stroke-dasharray:4 5;stroke-width:1}
.cLine{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.cGoal{fill:none;stroke:var(--prop);stroke-width:2.2;stroke-dasharray:3 6;stroke-linecap:round}
.cDot{fill:var(--card);stroke:var(--ink);stroke-width:2.2}
.cLast{fill:var(--hard);stroke:var(--card);stroke-width:2}
.cHalo{fill:var(--hard);opacity:.2}
.cT{font:600 11px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.cV{font:700 12px var(--body);fill:var(--ink);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label,.lbl{font-size:14px;color:var(--muted)}
input[type="date"],select{background:var(--soft);border:0;border-radius:16px;padding:13px 14px;width:100%;min-height:50px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:60px;height:60px;border-radius:999px;border:0;background:var(--soft);font-size:30px;line-height:1}
.stepper output{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:64px;line-height:1;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{border:0;background:var(--soft);border-radius:999px;padding:12px 16px;font-weight:600}
.choices button[aria-pressed="true"]{background:var(--ink);color:#fff}
.log{list-style:none;margin:0;padding:0}
.logItem{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.lDate{font-weight:600}
.lP{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.lBar{grid-column:1 / -1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.lBar span{display:block;height:100%;background:var(--ink);border-radius:99px;min-width:5px}
.lMeta{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0;text-decoration:underline}
.x[data-arm="1"]{color:var(--danger);font-weight:700}

/* regras */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;max-width:60ch}
.rules li::before{content:counter(r);width:30px;height:30px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.alert h2{color:var(--danger);font-size:26px}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.tabs .in{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;max-width:500px;width:100%;background:var(--card);border-radius:30px;padding:8px 6px;box-shadow:0 10px 30px rgba(20,18,12,.16)}
.tabs .t{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:#9A978F}
.tabs .t[aria-current="page"]{color:var(--ink)}
.tabs .t[aria-current="page"] .ic{stroke-width:2.4}
.tabs .mid{justify-self:center;width:62px;height:62px;border-radius:21px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.tabs .mid[aria-current="page"]{background:var(--hard);color:#1A0A02}

/* sheet de exercício */
.sheetWrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetWrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(13,13,12,.5)}
.sheet{position:relative;background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.shHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.shHead h2{font-size:34px}
.xBtn{width:44px;height:44px;border-radius:999px;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.figBox{background:var(--soft);border-radius:26px;padding:10px 6px}
.figBox .fig{width:100%;height:auto;max-height:200px;display:block}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minis figure{margin:0;background:var(--soft);border-radius:20px;padding:6px 4px 8px;text-align:center}
.minis figcaption{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.minis .fig{width:100%;height:auto;display:block}
.shDose{font-size:20px;font-weight:800;color:var(--hard-ink)}
.tipbox{background:var(--soft);border-radius:18px;padding:12px 14px;font-size:15px}
.shActions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 calc(24px + env(safe-area-inset-bottom));margin-bottom:calc(-24px - env(safe-area-inset-bottom))}
.shActions .pill{flex:1;min-width:150px}
.vid{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* figuras */
.fig{display:block}
.fb{stroke:var(--ink);stroke-linecap:round;fill:none}
.ff{stroke:var(--ink);opacity:.26;stroke-linecap:round;fill:none}
.fp{stroke:var(--prop);stroke-linecap:round;fill:none}
.fa{stroke:var(--hard);stroke-linecap:round;fill:none}
.fc{stroke:var(--hard);opacity:.55;fill:none;stroke-linecap:round}
.fg{stroke:var(--prop);stroke-linecap:round;fill:none}
.fd{stroke:#8f8b82;stroke-dasharray:4 4;stroke-linecap:round}
.fh{fill:var(--ink)}
.fac{fill:var(--hard)}
.fpf{fill:#8f8b82}
.ft{font:700 10px var(--body);fill:#8f8b82}

/* aviso flutuante */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:12px;z-index:40;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.3);max-width:calc(100% - 28px);font-size:15px}
.toast[hidden]{display:none}
.toast strong{font-variant-numeric:tabular-nums;font-size:22px}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}

@media (max-width:380px){
  .hero h1{font-size:48px}
  .pageTitle h1{font-size:38px}
  .rowMain{grid-template-columns:80px 1fr;gap:10px}
  .thumb{width:80px;height:52px}
  .tabs .t{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="root"></div>

<script id="app">(function(){
'use strict';
/* ---------- figuras dos exercícios ---------- */
/* Cada pose usa ângulos (0 = direita, 90 = baixo, -90 = cima), então os membros nunca esticam na animação. */
var LEN = {T:40, UA:24, FA:22, TH:38, SH:36, HEAD:16, FOOT:18};
function rad(d){ return d * Math.PI / 180; }
function pt(o, a, l){ return [o[0] + l * Math.cos(rad(a)), o[1] + l * Math.sin(rad(a))]; }
function lerp(a, b, t){ return a + (b - a) * t; }
function n1(v){ return v.toFixed(1); }

function mixPose(A, B, t){
  var P = {hip:[lerp(A.hip[0], B.hip[0], t), lerp(A.hip[1], B.hip[1], t)], torso:lerp(A.torso, B.torso, t), arms:[], legs:[]};
  A.arms.forEach(function(a, i){ var b = B.arms[i]; P.arms.push({dx:a.dx || 0, dy:a.dy || 0, far:a.far, upper:lerp(a.upper, b.upper, t), fore:lerp(a.fore, b.fore, t)}); });
  A.legs.forEach(function(l, i){ var b = B.legs[i]; P.legs.push({dx:l.dx || 0, dy:l.dy || 0, far:l.far, thigh:lerp(l.thigh, b.thigh, t), shin:lerp(l.shin, b.shin, t), foot:l.foot == null ? null : lerp(l.foot, b.foot, t)}); });
  return P;
}
function solvePose(P){
  var sh = pt(P.hip, P.torso, LEN.T), head = pt(sh, P.torso, LEN.HEAD);
  var J = {hip:P.hip, sh:sh, head:head, arms:[], legs:[]};
  P.arms.forEach(function(a){ var o = [sh[0] + a.dx, sh[1] + a.dy], e = pt(o, a.upper, LEN.UA), h = pt(e, a.fore, LEN.FA); J.arms.push({o:o, e:e, h:h, far:a.far}); });
  P.legs.forEach(function(l){ var o = [P.hip[0] + l.dx, P.hip[1] + l.dy], k = pt(o, l.thigh, LEN.TH), a = pt(k, l.shin, LEN.SH); J.legs.push({o:o, k:k, a:a, f:l.foot == null ? null : pt(a, l.foot, LEN.FOOT), far:l.far}); });

var CIRC = 2 * Math.PI * 104;
var T = {mode:null, ph:[], idx:-1, end:0, left:0, run:false, iv:null, lastS:-1, wl:null};
function phasesFor(mode){
  var wi = weekInfo(S.week);
  if(mode === 'bike') return [{n:'Bike leve', s:wi.bike*60, k:'easy'}];
  var ph = [{n:'Aquecer', s:180, k:'easy'}];
  for(var i = 1; i <= wi.tiros.n; i++){
    ph.push({n:'Forte', s:wi.tiros.f*60, k:'hard', r:i});
    if(i < wi.tiros.n) ph.push({n:'Leve', s:60, k:'easy', r:i});
  }
  ph.push({n:'Soltar', s:180, k:'easy'});
  return ph;
}
function ensureTimer(){
  if(T.mode !== S.mode || (!T.run && T.idx === -1)){
    clearInterval(T.iv); T.run = false; T.idx = -1; T.left = 0;
    T.mode = S.mode; T.ph = phasesFor(S.mode);
  }
}
function timerHTML(){
  ensureTimer();
  var wi = weekInfo(S.week);
  var sum = S.mode === 'tiros'
    ? 'Na semana ' + S.week + ', são ' + wi.tiros.n + ' tiros de ' + wi.tiros.f + ' minutos forte e 1 minuto leve. Com o começo e o fim leves, uns ' + (wi.tiros.n * (wi.tiros.f + 1) + 5) + ' minutos.'
    : 'Na semana ' + S.week + ', são ' + wi.bike + ' minutos de bike leve, num ritmo em que dá pra conversar.';
  return pageTitle('Timer', S.mode === 'tiros' ? 'Tiros' : 'Bike leve', sum) +
    '<div class="seg" role="group" aria-label="Escolher treino">' +
      '<button type="button" data-mode="tiros" aria-pressed="' + (S.mode === 'tiros') + '">Tiros</button>' +
      '<button type="button" data-mode="bike" aria-pressed="' + (S.mode === 'bike') + '">Bike leve</button></div>' +
    '<div class="clock" id="tClock"><div class="ringBox">' +
      '<svg class="ringT" viewBox="0 0 240 240" aria-hidden="true"><circle class="rTrack" cx="120" cy="120" r="104"/><circle class="rProg" id="tRing" cx="120" cy="120" r="104" transform="rotate(-90 120 120)"/></svg>' +
      '<div class="clockIn"><div class="phaseName" id="tPhase">Pronto</div><div class="time" id="tTime">0:00</div><div class="round" id="tRound"></div></div>' +
    '</div><div class="next" id="tNext"></div></div>' +
    '<div class="row2"><button type="button" class="pill black big" id="tStart">Começar</button><button type="button" class="pill white" id="tReset">Zerar</button></div>' +
    '<p class="small" style="padding:0 4px">Deixa a tela ligada e o som do celular alto. Ele apita em cada troca e nos 3 últimos segundos.</p>';
}
function paintTimer(){
  var $ = function(id){ return document.getElementById(id); };
  var clock = $('tClock'); if(!clock) return;
  var len = T.ph.length;
  var done = T.idx >= len;
  var p = (T.idx >= 0 && !done) ? T.ph[T.idx] : null;
  var rounds = T.ph.filter(function(x){ return x.k === 'hard'; }).length;
  var leftMs = p ? (T.run ? T.end - Date.now() : T.left) : 0;
  var totalS = T.ph.reduce(function(s,x){ return s + x.s; }, 0);
  clock.className = 'clock' + (p ? ' ' + p.k : '');
  $('tPhase').textContent = done ? 'Acabou' : (p ? p.n : 'Pronto');
  $('tTime').textContent = p ? fmt(leftMs/1000) : (done ? '0:00' : fmt(totalS));
  $('tRound').textContent = (p && p.k === 'hard' && p.r) ? 'Tiro ' + p.r + ' de ' + rounds : (p && p.n === 'Leve' ? 'Recupera o ar' : (!p && !done ? 'Tempo total' : ''));
  var frac = p ? Math.min(1, Math.max(0, 1 - leftMs/(p.s*1000))) : (done ? 1 : 0);
  $('tRing').style.strokeDashoffset = String(CIRC * frac);
  var nx = T.ph[T.idx + 1];
  $('tNext').textContent = (p && nx) ? 'Depois: ' + nx.n + ' ' + fmt(nx.s) : ((!p && !done && T.ph[0]) ? 'Primeiro: ' + T.ph[0].n + ' ' + fmt(T.ph[0].s) : '');
  $('tStart').textContent = T.run ? 'Pausar' : (done ? 'Fazer de novo' : (T.idx >= 0 ? 'Continuar' : 'Começar'));
}
function startTimer(){
  ac();
  if(T.idx >= T.ph.length) T.idx = -1;
  if(T.idx === -1){ T.idx = 0; T.left = T.ph[0].s * 1000; beepPhase(T.ph[0].k); }
  T.end = Date.now() + T.left; T.run = true; T.lastS = -1;
  clearInterval(T.iv); T.iv = setInterval(tick, 200);
  wake(true); paintTimer();
}
function pauseTimer(){ T.left = Math.max(0, T.end - Date.now()); T.run = false; clearInterval(T.iv); wake(false); paintTimer(); }
function resetTimer(){ clearInterval(T.iv); T.run = false; T.idx = -1; T.left = 0; T.mode = S.mode; T.ph = phasesFor(S.mode); wake(false); paintTimer(); }
function tick(){
  var now = Date.now(), left = T.end - now, changed = false;
  while(left <= 0){
    T.idx++;
    if(T.idx >= T.ph.length){
      clearInterval(T.iv); T.run = false; T.left = 0; wake(false); beepDone(); vib([300,150,300,150,300]); paintTimer(); return;
    }
    T.end += T.ph[T.idx].s * 1000; left = T.end - now; changed = true;
  }
  if(changed){ T.lastS = -1; var k = T.ph[T.idx].k; beepPhase(k); vib(k === 'hard' ? [200,100,200] : [450]); }
  var s = Math.ceil(left / 1000);
  if(s <= 3 && s >= 1 && s !== T.lastS){ T.lastS = s; beepTick(); }
  paintTimer();
}
function wake(on){
  try{
    if(on){
      if(navigator.wakeLock && !T.wl){ navigator.wakeLock.request('screen').then(function(l){ T.wl = l; }, function(){}); }
    } else if(T.wl){ T.wl.release().catch(function(){}); T.wl = null; }
  }catch(e){ T.wl = null; }
}
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && T.run){ try{ if(navigator.wakeLock){ T.wl = null; navigator.wakeLock.request('screen').then(function(l){ T.wl = l; }, function(){}); } }catch(e){} tick(); }
});

/* ---------- som ---------- */
var AC = null;
function ac(){
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); }
    if(AC && AC.state === 'suspended') AC.resume();
  }catch(e){}
  return AC;
}
function tone(f, dur, delay){
  var a = ac(); if(!a) return;
  try{
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}
function beepPhase(k){ if(k === 'hard'){ tone(880, 0.18, 0); tone(880, 0.18, 0.26); } else { tone(523, 0.5, 0); } }
function beepTick(){ tone(660, 0.08, 0); }
function beepDone(){ tone(880, 0.2, 0); tone(988, 0.2, 0.3); tone(1175, 0.45, 0.6); }

    var tt = (x.t >= 0 && TIMES[x.t]) ? 'Recuperou em ' + TIMES[x.t].toLowerCase() : '';
    return '<li class="logItem"><div class="lDate">' + DS[d.getDay()] + ' ' + ddmm(d) + ', ' + esc(x.aula) + '</div>' +
      '<div class="lP">' + x.p + ' ' + (x.p === 1 ? 'pausa' : 'pausas') + '</div>' +
      '<div class="lBar"><span style="width:' + Math.round((x.p / max) * 100) + '%"></span></div>' +
      '<div class="lMeta"><span>' + tt + '</span><button type="button" class="x" data-del="' + x.id + '">Apagar</button></div></li>';
  }).join('') + '</ol>' : '<p class="small">Ainda sem aulas anotadas. Depois da próxima aula, conta as pausas e salva aqui.</p>';

  return pageTitle('Pausas', 'Quantas vezes parei', 'É o número que mostra se o gás está melhorando. Tem que cair com as semanas.') +
    '<section class="card">' + top + chartHTML() + trend + '</section>' +
    '<section class="card"><h2>Anotar aula</h2>' +
      '<div class="two">' +
        '<div class="field"><label for="pDate">Dia</label><input type="date" id="pDate" value="' + esc(f.date) + '"></div>' +
        '<div class="field"><label for="pAula">Aula</label><select id="pAula">' + aulas.map(function(x){ return '<option value="' + x + '"' + (f.aula === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>' +
      '</div>' +
      '<div class="field"><span class="lbl" id="pLbl">Quantas vezes você parou pra respirar?</span>' +
        '<div class="stepper" role="group" aria-labelledby="pLbl"><button type="button" id="pMinus" aria-label="Uma a menos">' + ic('minus', 26, 2.4) + '</button><output id="pCount" aria-live="polite">' + f.p + '</output><button type="button" id="pPlus" aria-label="Uma a mais">' + ic('plus', 26, 2.4) + '</button></div></div>' +
      '<div class="field"><span class="lbl">Quanto tempo levou pra recuperar o ar, mais ou menos?</span>' +
        '<div class="choices">' + TIMES.map(function(t, i){ return '<button type="button" data-t="' + i + '" aria-pressed="' + (f.t === i) + '">' + t + '</button>'; }).join('') + '</div></div>' +
      '<button type="button" class="pill black big" id="pSave">Salvar</button>' +
      '<p class="small">' + (ART ? 'Fica salvo no plano e aparece em qualquer aparelho.' : 'Fica salvo neste aparelho.') + '</p>' +
    '</section>' +
    '<section class="card"><h2>Histórico</h2>' + list + '</section>';
}
function savePausa(){
  var f = S.f;
  if(!f.date){ showMsg('Escolhe o dia da aula.'); return; }
  LOG = mergeLog(LOG, [{id:Date.now(), date:f.date, aula:f.aula, p:f.p, t:f.t}]);
  S.f = {date:iso(new Date()), aula:defaultAula(new Date()), p:0, t:-1};
  var btn = document.getElementById('pSave');
  if(btn){ btn.disabled = true; btn.textContent = 'Salvando…'; }
  persist().then(function(r){ render(); showMsg(r === 'shared' ? 'Salvo.' : 'Salvo neste aparelho.'); });
}
function deletePausa(id){
  DEL.push(isNaN(Number(id)) ? id : Number(id));
  LOG = LOG.filter(function(x){ return String(x.id) !== String(id); });
  persist().then(function(){ render(); showMsg('Apagado.'); });
}

/* ---------- folha do exercício ---------- */
var sheetWrap = document.createElement('div');
sheetWrap.className = 'sheetWrap'; sheetWrap.hidden = true;
document.body.appendChild(sheetWrap);
var SH = {key:null, ck:null, rest:60, raf:0, opener:null, t0:0};
var REDUCED = false;
try{ REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function ease(x){ return x * x * (3 - 2 * x); }
function figT(ms){
  var p = (ms % 3400) / 3400;
  if(p < 0.12) return 0;
  if(p < 0.5) return ease((p - 0.12) / 0.38);
  if(p < 0.62) return 1;
  return 1 - ease((p - 0.62) / 0.38);
}
function loopFig(ts){
  var box = document.getElementById('shFig');
  if(!box || sheetWrap.hidden){ SH.raf = 0; return; }
  if(!SH.t0) SH.t0 = ts;
  var svg = box.firstChild;
  if(svg) svg.innerHTML = figInner(SH.key, figT(ts - SH.t0));
  SH.raf = requestAnimationFrame(loopFig);
}
function openSheet(key, ck, rest, opener){
  var e = EX[key], wi = weekInfo(S.week), done = !!CHK[ck];
  SH.key = key; SH.ck = ck; SH.rest = rest || 60; SH.opener = opener || null; SH.t0 = 0;
  sheetWrap.innerHTML = '<div class="scrim" data-sh="close"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">' +
      '<div class="grab"></div>' +
      '<div class="shHead"><h2 id="shT">' + esc(e.n) + '</h2><button type="button" class="xBtn" data-sh="close" aria-label="Fechar">' + ic('x', 22) + '</button></div>' +
      '<div class="figBox" id="shFig">' + figSVG(key, 0) + '</div>' +
      '<div class="minis"><figure>' + figSVG(key, 0) + '<figcaption>Começo</figcaption></figure><figure>' + figSVG(key, 1) + '<figcaption>Final</figcaption></figure></div>' +
      '<div class="shDose">' + setsTxt(wi) + ' de ' + esc(e.r) + '</div>' +
      '<p class="lead">' + esc(e.d) + '</p>' +
      '<div class="tipbox"><b>Dica:</b> ' + esc(e.tip) + '</div>' +
      '<a class="vid" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(e.q) + '" target="_blank" rel="noopener noreferrer">' + ic('play', 16) + 'Ver vídeo do exercício</a>' +
      '<div class="shActions"><button type="button" class="pill ghost" data-sh="rest">Descanso ' + fmt(SH.rest) + '</button>' +
      '<button type="button" class="pill black" data-sh="done">' + (done ? 'Desfazer' : 'Marcar como feito') + '</button></div>' +
    '</div>';
  sheetWrap.hidden = false;
  document.body.classList.add('noscroll');
  var x = sheetWrap.querySelector('.xBtn'); if(x) x.focus();
  if(!REDUCED){ cancelAnimationFrame(SH.raf); SH.raf = requestAnimationFrame(loopFig); }
}
function closeSheet(){
  if(sheetWrap.hidden) return;
  sheetWrap.hidden = true; sheetWrap.innerHTML = '';
  cancelAnimationFrame(SH.raf); SH.raf = 0;
  document.body.classList.remove('noscroll');
  var o = SH.opener; SH.opener = null;
  if(o && o.isConnected){ try{ o.focus(); }catch(e){} }
}
function toggleDone(ck, force){
  var on = force == null ? !CHK[ck] : force;
  if(on) CHK[ck] = 1; else delete CHK[ck];
  lsSet('sanda_chk_v1', CHK);
}
sheetWrap.addEventListener('click', function(e){
  var b = e.target.closest('[data-sh]'); if(!b) return;
  var a = b.dataset.sh;
  if(a === 'close'){ closeSheet(); return; }
  if(a === 'rest'){ startRest(SH.rest); return; }
  if(a === 'done'){
    var ck = SH.ck; toggleDone(ck);
    var was = !!CHK[ck];
    closeSheet(); render();
    showMsg(was ? 'Marcado como feito.' : 'Desmarcado.');
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !sheetWrap.hidden) closeSheet();
  if(e.key === 'Tab' && !sheetWrap.hidden){
    var els = sheetWrap.querySelectorAll('button, a[href]');
    if(!els.length) return;
    var first = els[0], last = els[els.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- montagem ---------- */
var root = document.getElementById('root');
function viewHTML(){
  switch(S.view){
    case 'semana': return semanaHTML();
    case 'dia': return diaHTML();
    case 'timer': return timerHTML();
    case 'pausas': return pausasHTML();
    case 'regras': return regrasHTML();
    default: return hojeHTML();
  }
}
function render(){
  root.innerHTML = '<div class="app">' + headerHTML() + '<main class="view" id="view">' + viewHTML() + '</main></div>' + navHTML();
  if(S.view === 'timer') paintTimer();
}
function go(v){ closeSheet(); S.view = v; render(); try{ window.scrollTo(0, 0); }catch(e){} }

root.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var ds = b.dataset;
  if(ds.view){ go(ds.view); return; }
  if(ds.day != null){ S.day = Number(ds.day); go('dia'); return; }
  if(ds.timer){ if(T.mode !== ds.timer && T.idx >= 0){ clearInterval(T.iv); T.run = false; T.idx = -1; wake(false); } S.mode = ds.timer; go('timer'); return; }
  if(ds.mode){ if(ds.mode !== S.mode){ clearInterval(T.iv); T.run = false; T.idx = -1; wake(false); S.mode = ds.mode; render(); } return; }
  if(ds.ex){ openSheet(ds.ex, ds.ck, Number(ds.rest), b); return; }
  if(ds.tick){
    var k = ds.tick, on = b.getAttribute('aria-pressed') !== 'true';
    toggleDone(k, on);
    b.setAttribute('aria-pressed', String(on));
    var row = b.closest('.row'); if(row) row.classList.toggle('done', on);
    var sec = b.closest('.card');
    if(sec){
      var n = sec.querySelectorAll('.tick[aria-pressed="true"]').length, c = sec.querySelector('.count b');
      if(c) c.textContent = n;
    }
    return;
  }
  if(ds.pausa){ var parts = ds.pausa.split('|'); S.f.date = parts[0]; S.f.aula = (parts[1] === '19h' || parts[1] === '8h40') ? parts[1] : 'Outra'; go('pausas'); return; }
  if(ds.t != null){
    var i = Number(ds.t); S.f.t = S.f.t === i ? -1 : i;
    b.parentElement.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(Number(x.dataset.t) === S.f.t)); });
    return;
  }
  if(ds.del){
    if(b.getAttribute('data-arm') === '1'){ deletePausa(ds.del); return; }
    b.setAttribute('data-arm', '1'); b.textContent = 'Toca de novo pra apagar';
    setTimeout(function(){ if(b.isConnected){ b.removeAttribute('data-arm'); b.textContent = 'Apagar'; } }, 3000);
    return;
  }
  switch(b.id){
    case 'wkPrev': if(S.week > 1){ S.week--; render(); } break;
    case 'wkNext': if(S.week < WEEKS){ S.week++; render(); } break;
    case 'tStart': if(T.run) pauseTimer(); else startTimer(); break;
    case 'tReset': resetTimer(); break;
    case 'pMinus': S.f.p = Math.max(0, S.f.p - 1); document.getElementById('pCount').textContent = S.f.p; break;
    case 'pPlus': S.f.p = Math.min(40, S.f.p + 1); document.getElementById('pCount').textContent = S.f.p; break;
    case 'pSave': savePausa(); break;
  }
});
root.addEventListener('change', function(e){
  var t = e.target;
  if(t.id === 'pDate') S.f.date = t.value;
  if(t.id === 'pAula') S.f.aula = t.value;
});

try{
  var gt = sessionStorage.getItem('sanda_goto');
  if(gt){ sessionStorage.removeItem('sanda_goto'); if(gt === 'pausas'){ S.view = 'pausas'; setTimeout(function(){ showMsg('Salvo.'); }, 300); } }
}catch(e){}
render();

})();</script>
